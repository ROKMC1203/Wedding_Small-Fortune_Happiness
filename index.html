<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test_20260917_test_new</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .card {
      width: min(90%, 520px);
      padding: 48px 36px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 32px;
      text-align: center;
      font-size: 40px;
      color: #222222;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #333333;
    }

    select,
    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      font-size: 16px;
      background: #ffffff;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: #555555;
    }

    button {
      width: 100%;
      height: 50px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #222222;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #444444;
    }

    button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      color: #555555;
      min-height: 20px;
    }

    #message.success {
      color: #1a7f37;
      font-weight: 600;
    }

    #message.error {
      color: #c0392b;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>축하합니다</h1>

    <div class="field">
      <label for="friendSelect">지인 선택</label>
      <select id="friendSelect">
        <option value="">지인을 선택해주세요</option>
        <option value="지인1">지인1</option>
        <option value="지인2">지인2</option>
        <option value="지인3">지인3</option>
      </select>
    </div>

    <div class="field">
      <label for="nameInput">본인 이름</label>
      <input id="nameInput" type="text" placeholder="본인 이름을 입력해주세요">
    </div>

    <button id="submitButton" type="button" onclick="submitForm()">제출</button>

    <div id="message"></div>
  </main>

  <!-- Supabase JavaScript 클라이언트 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script>
    // ===== Supabase 연결 정보 (여기만 수정하면 됩니다) =====
    const SUPABASE_URL = "여기에_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "여기에_SUPABASE_ANON_KEY";
    const SUPABASE_TABLE = "responses";
    // =====================================================

    // 연결 정보를 아직 입력하지 않았으면 Supabase 없이 UI만 동작합니다.
    const isConfigured =
      SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

    const supabaseClient =
      isConfigured && window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    function setMessage(text, type) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = type || "";
    }

    async function submitForm() {
      const friend = document.getElementById("friendSelect").value;
      const name = document.getElementById("nameInput").value.trim();
      const button = document.getElementById("submitButton");

      if (!friend) {
        setMessage("지인을 선택해주세요.", "error");
        return;
      }

      if (!name) {
        setMessage("본인 이름을 입력해주세요.", "error");
        return;
      }

      // Supabase 연결 전에는 입력값만 확인합니다.
      if (!supabaseClient) {
        setMessage(
          "선택한 지인: " + friend + " / 입력한 이름: " + name +
          " (Supabase 미연결 상태)",
          ""
        );
        return;
      }

      button.disabled = true;
      setMessage("저장 중입니다...", "");

      try {
        const { error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .insert({ friend: friend, name: name });

        if (error) {
          console.error(error);
          setMessage("저장에 실패했습니다: " + error.message, "error");
          return;
        }

        setMessage("등록되었습니다.", "success");
        document.getElementById("friendSelect").value = "";
        document.getElementById("nameInput").value = "";
      } catch (e) {
        console.error(e);
        setMessage("저장에 실패했습니다: " + e.message, "error");
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
