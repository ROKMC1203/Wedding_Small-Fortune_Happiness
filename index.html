<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김태현♥윤혜주 결혼 이벤트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .card {
      width: min(90%, 520px);
      padding: 48px 36px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #555555;
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 40px;
      color: #222222;
    }

    .intro {
      margin: 0 0 24px;
      font-size: 30px;
      line-height: 1.6;
      color: #333333;
      text-align: center;
    }

    .box-title {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
      color: #222222;
    }

    .gift-box,
    .howto {
      margin-bottom: 24px;
      font-size: 14px;
      color: #444444;
    }

    .gift-box ol,
    .howto ol {
      margin: 0;
      padding-left: 20px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #333333;
    }

    select,
    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      font-size: 16px;
      background: #ffffff;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: #555555;
    }

    button {
      width: 100%;
      height: 50px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #222222;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #444444;
    }

    button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      color: #555555;
      min-height: 20px;
    }

    #message.success {
      color: #1a7f37;
      font-weight: 600;
    }

    #message.error {
      color: #c0392b;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="subtitle">저희의 결혼식에 보내주신 관심 감사합니다.</p>

    <p class="intro">
      감사의 마음을 담아 작은 이벤트를 준비했습니다.<br>
      참여해주신 분들 중 추첨을 통해 아래와 같은 선물을 드립니다.
    </p>

    <div class="gift-box">
      <p class="box-title">■ 선물</p>
      <ol>
        <li>상품권 5만원 - 1명</li>
        <li>상품권 3만원 - 1명</li>
        <li>상품권 1만원 - 2명</li>
      </ol>
    </div>

    <div class="howto">
      <p class="box-title">※ 참여 방법</p>
      <ol>
        <li>'초대해주신 분' 선택</li>
        <li>'본인 이름' 작성</li>
        <li>'제출' 버튼 클릭</li>
      </ol>
    </div>

    <div class="field">
      <label for="friendSelect">초대해주신 분</label>
      <select id="friendSelect">
        <option value="">초대해주신 분을 선택해주세요</option>
        <option value="지인1">지인1</option>
        <option value="지인2">지인2</option>
        <option value="지인3">지인3</option>
      </select>
    </div>

    <div class="field">
      <label for="nameInput">본인 이름</label>
      <input id="nameInput" type="text" placeholder="본인 이름을 입력해주세요">
    </div>

    <button id="submitButton" type="button" onclick="submitForm()">제출</button>

    <div id="message"></div>
  </main>

  <!-- Supabase JavaScript 클라이언트 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script>
    // ===== Supabase 연결 정보 (여기만 수정하면 됩니다) =====
    const SUPABASE_URL = "https://pmuvjxqkiwhfrrzttlzf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sl1tbnKFLEXJFQN9M-nCgw_tPoL9kjF";
    const SUPABASE_TABLE = "responses";
    // =====================================================

    // 연결 정보를 아직 입력하지 않았으면 Supabase 없이 UI만 동작합니다.
    const isConfigured =
      SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

    const supabaseClient =
      isConfigured && window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    function setMessage(text, type) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = type || "";
    }

    async function submitForm() {
      const friend = document.getElementById("friendSelect").value;
      const name = document.getElementById("nameInput").value.trim();
      const button = document.getElementById("submitButton");

      if (!friend) {
        setMessage("초대해주신 분을 선택해주세요.", "error");
        return;
      }

      if (!name) {
        setMessage("본인 이름을 입력해주세요.", "error");
        return;
      }

      // Supabase 연결 전에는 입력값만 확인합니다.
      if (!supabaseClient) {
        setMessage(
          "선택한 분: " + friend + " / 입력한 이름: " + name +
          " (Supabase 미연결 상태)",
          ""
        );
        return;
      }

      button.disabled = true;
      setMessage("저장 중입니다...", "");

      try {
        const { error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .insert({ friend: friend, name: name });

        if (error) {
          console.error(error);
          setMessage("저장에 실패했습니다: " + error.message, "error");
          return;
        }

        setMessage("등록되었습니다.", "success");
        document.getElementById("friendSelect").value = "";
        document.getElementById("nameInput").value = "";
      } catch (e) {
        console.error(e);
        setMessage("저장에 실패했습니다: " + e.message, "error");
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
